<!DOCTYPE html>
<html>
<head>
    <title>GTW Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <button id="launch-button" onclick="launchGame()">Launch Game</button>

        <h2>Split Categories</h2>
        <div id="split-categories"></div>

        <button onclick="addSplitCategory()">Add Category</button>

        <h2>Enabled Mods</h2>
        <div id="enabled"></div>

        <h2>Disabled Mods</h2>
        <div id="disabled"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
